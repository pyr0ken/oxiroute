[workspace]
resolver = "2"
members = [
    "crates/oxiroute-core",
    "crates/oxiroute-translator",
    "crates/oxiroute-engine",
    "crates/oxiroute-auth",
    "crates/oxiroute-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mohammad Hossein Yaghobi <mhyaghobi@gmail.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8", features = ["macros", "tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
futures-util = "0.3"
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.7"
eventsource-stream = "0.2"
dashmap = "6.1"
arc-swap = "1.7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
aes-gcm = "0.10"
scrypt = "0.11"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"

# Internal workspace crates
oxiroute-core = { path = "crates/oxiroute-core" }
oxiroute-translator = { path = "crates/oxiroute-translator" }
oxiroute-engine = { path = "crates/oxiroute-engine" }
oxiroute-auth = { path = "crates/oxiroute-auth" }
